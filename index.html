<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>二课答疑 · 办事卡</title>
<style>
/* ============ 单文件版：校园蓝绿主题，移动端 375px 优先 ============ */
:root{
  --motion-dur:200ms; --motion-dur-fast:150ms; --motion-ease:ease-out;
  --bg:#f2f7f8; --card:#fff; --ink:#17323b; --sub:#6b8089; --line:#e3ecee;
  --brand:#0e8f8b; --brand-2:#2f74e0; --brand-ink:#0b6a72;
  --brand-soft:#eaf9f6; --brand-soft-2:#eff5ff;
  --grad:linear-gradient(135deg,#12a19a 0%,#2f74e0 100%);
  --shadow-sm:0 2px 10px rgba(14,80,95,.06);
  --shadow:0 8px 26px rgba(14,80,95,.09);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);overflow-x:hidden;overflow-wrap:anywhere;
  font:15px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
body::before{content:"";position:fixed;left:0;right:0;top:0;height:320px;pointer-events:none;z-index:0;
  background:radial-gradient(120% 100% at 12% 0%,rgba(18,161,154,.14),transparent 70%),
             radial-gradient(110% 100% at 95% 0%,rgba(47,116,224,.12),transparent 70%)}
a{color:inherit;text-decoration:none}
button,input{font:inherit}
[hidden]{display:none!important}
.app{position:relative;z-index:1;width:100%;max-width:420px;min-width:0;margin:0 auto;
  padding:0 12px calc(92px + env(safe-area-inset-bottom))}

/* 顶栏 */
.topbar{display:flex;align-items:center;justify-content:space-between;min-width:0;padding:14px 4px 10px}
.brand{font-size:17px;font-weight:750;letter-spacing:.02em;color:#0b4f58;background:none;border:0;padding:0;cursor:pointer;text-align:left;font-family:inherit}
.brand span{margin-left:6px;font-size:11px;font-weight:700;color:#fff;background:var(--grad);border-radius:7px;padding:3px 7px}
.topbar__link{font-size:13px;color:var(--sub);padding:8px;border-radius:10px;min-height:44px;display:inline-flex;align-items:center;background:none;border:0;cursor:pointer}

/* 通用视图 */
.view{min-width:0;padding-top:6px}
.view__title{margin:8px 4px 14px;font-size:19px;font-weight:750;color:#123840}
.view-head{padding:2px 0 12px}
.back{display:inline-flex;align-items:center;min-height:44px;font-size:14px;color:var(--sub);padding:6px 8px;border-radius:10px;background:none;border:0;cursor:pointer}

/* 首屏 */
.hero{position:relative;overflow:hidden;margin:8px 0 18px;padding:22px 18px 20px;border-radius:18px;
  background:linear-gradient(135deg,#fff 0%,#f4fbfa 58%,#f1f6ff 100%);
  border:1px solid #e6f0f0;box-shadow:var(--shadow-sm)}
.hero::before{content:"";position:absolute;left:0;top:0;width:100%;height:4px;background:var(--grad)}
.hero__title{margin:0;font-size:23px;line-height:1.45;font-weight:750;letter-spacing:-.01em;color:#123840}
.hero__sub{margin:10px 0 0;font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--brand-ink)}
.search{display:flex;gap:8px;min-width:0}
.search__input{flex:1;min-width:0;height:46px;padding:0 14px;border:1px solid #dce8e9;border-radius:14px;
  background:#fff;color:var(--ink);outline:none;box-shadow:var(--shadow-sm)}
.search__input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(14,143,139,.14)}
.btn{flex:0 0 auto;height:46px;padding:0 18px;border:0;border-radius:14px;font-weight:700;cursor:pointer}
.btn--primary{background:var(--grad);color:#fff;box-shadow:0 4px 12px rgba(20,120,160,.22)}
/* 分类关键词引导：搜索栏下方的主引导区 */
.guide{margin-top:20px;min-width:0}
.guide__title{margin:0 4px 12px;font-size:13px;font-weight:700;color:var(--brand-ink);letter-spacing:.03em;
  display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.guide__title span{margin-left:auto;font-size:12px;font-weight:500;color:#5b7078;letter-spacing:0}
/* 分类 tab 横向滚动：容器自身滚动，不撑破 375px 页面 */
.guide__tabs{display:flex;gap:7px;min-width:0;max-width:100%;overflow-x:auto;
  -webkit-overflow-scrolling:touch;padding:2px 4px 11px;scrollbar-width:none}
.guide__tabs::-webkit-scrollbar{display:none}
.guide-tab{flex:0 0 auto;min-height:36px;padding:7px 13px;border:1px solid #d9eaea;border-radius:999px;
  background:rgba(255,255,255,.88);color:#40656d;font-size:13px;font-weight:600;white-space:nowrap;
  cursor:pointer;touch-action:manipulation}
.guide-tab small{font-weight:500;opacity:.72;margin-left:4px}
.guide-tab.is-active{background:var(--grad);border-color:transparent;color:#fff;
  box-shadow:0 4px 12px rgba(20,120,160,.2)}
.guide-tab.is-pressed{transform:scale(.96)}
.guide-group{margin-bottom:2px;min-width:0}
.guide-group__name{margin:0 4px 6px;font-size:12px;font-weight:700;color:var(--sub);
  display:flex;align-items:center;gap:6px}
.guide-group__name::before{content:"";flex:0 0 3px;width:3px;height:11px;border-radius:2px;background:var(--grad)}
.guide-group__row{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.kw{min-width:0;max-width:100%;min-height:36px;padding:6px 11px;border:1px solid #d9eaea;border-radius:10px;
  background:rgba(255,255,255,.9);color:#2b5a61;font-size:13px;line-height:1.4;text-align:left;
  cursor:pointer;touch-action:manipulation;word-break:break-all}
.kw.is-pressed{transform:scale(.96)}
/* 浏览全部主题：原生 details，无入场动效，天然支持减少动效偏好 */
.browse{margin-top:18px;min-width:0;border:1px solid var(--line);border-radius:16px;
  background:rgba(255,255,255,.66);box-shadow:var(--shadow-sm);overflow:hidden}
.browse__summary{display:flex;align-items:center;gap:8px;min-height:46px;padding:12px 16px;
  font-size:14px;font-weight:700;color:var(--brand-ink);cursor:pointer;list-style:none}
.browse__summary::-webkit-details-marker{display:none}
.browse__summary::before{content:"＋";font-size:16px;color:var(--brand)}
.browse[open] .browse__summary::before{content:"－"}
.browse__summary span{margin-left:auto;font-size:12px;font-weight:500;color:var(--sub)}
.browse__groups{padding:0 14px 14px;min-width:0}
.browse__group{margin-top:14px;min-width:0}
.browse__cat{margin:0 0 8px 4px;font-size:12px;font-weight:700;color:var(--sub)}
.browse .chips{gap:6px}
.browse .chip{min-height:38px;padding:7px 12px;font-size:13px}

.quick{margin-top:16px}
.quick__title{margin:0 4px 10px;font-size:13px;font-weight:700;color:var(--sub);letter-spacing:.03em}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-width:0}
.chip{position:relative;overflow:hidden;min-width:0;max-width:100%;min-height:44px;
  padding:9px 14px;border:1px solid var(--line);border-radius:999px;background:#fff;color:#33555e;
  font-size:14px;text-align:left;cursor:pointer;touch-action:manipulation;box-shadow:var(--shadow-sm)}
.chip::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,#d7f2ee,#dfeaff);opacity:0}
.chip > span{position:relative;display:inline-block}
.chip.is-active::before{opacity:1}
.chip.is-active{color:#0b6a72;border-color:#a9ddd7;box-shadow:0 4px 12px rgba(14,143,139,.14)}

/* 状态：空 / 提示 */
.state,.app-state{min-width:0;margin-top:20px}
.state__box,.notice,.loading-box{min-width:0;background:#fff;border:1px solid var(--line);
  border-radius:16px;padding:18px 16px;box-shadow:var(--shadow-sm)}
.state__title{margin:0 0 6px;font-size:15px;font-weight:700;color:#123840}
.state__desc{margin:0 0 14px;font-size:13px;color:var(--sub)}
.state__chips{margin-top:4px}
.notice{border-color:#fecaca;color:#991b1b}
.notice__text{margin:0;font-size:14px}
.loading-box{color:var(--sub);font-size:14px}
/* 轻量提示 Toast：仅在无法持久保存（隐私 / 本地模式）时由 JS 触发，2 秒自动消失，不阻挡卡片 */
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(8px);
  max-width:84vw;padding:11px 16px;border-radius:14px;background:rgba(18,40,46,.92);color:#fff;
  font-size:13px;line-height:1.45;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.22);
  opacity:0;pointer-events:none;transition:opacity .22s ease,transform .22s ease;z-index:80}
.toast.is-show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 结构化结果卡 */
.card{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:18px 16px;box-shadow:var(--shadow)}
.block{min-width:0;padding:14px 0;border-bottom:1px dashed #e6edef}
.block:first-child{padding-top:0}
.block:last-child{padding-bottom:0;border-bottom:0}
.block__title{display:flex;align-items:center;gap:6px;margin:0 0 8px;font-size:12px;font-weight:700;
  letter-spacing:.04em;color:var(--brand-ink)}
.block__title::before{content:"";flex:0 0 3px;width:3px;height:12px;border-radius:2px;background:var(--grad)}
.block--meta .block__title::before{background:#b6c6ca}
.block__text{margin:0;white-space:pre-line;word-break:break-word}
.block--lead .block__text{font-size:16px;font-weight:650;line-height:1.8;color:#103b44;
  background:linear-gradient(135deg,#eaf9f6,#eff5ff);border-left:3px solid var(--brand);
  border-radius:0 12px 12px 0;padding:14px}
.steps{list-style:none;margin:0;padding:0;counter-reset:step}
.step{display:flex;gap:10px;min-width:0;padding:8px 0;counter-increment:step}
.step::before{content:counter(step);flex:0 0 22px;height:22px;margin-top:2px;display:flex;
  align-items:center;justify-content:center;border-radius:50%;background:var(--grad);
  color:#fff;font-size:12px;font-weight:700}
.step__body{flex:1;min-width:0}
.step__row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;min-width:0}
.step__text{margin:0;flex:1;min-width:0;white-space:pre-line}
.step__note{margin:6px 0 0;font-size:13px;color:var(--sub);white-space:pre-line}
.step__arrow{flex:0 0 8px;width:8px;height:8px;margin-top:7px;border-right:2px solid #9ca3af;border-bottom:2px solid #9ca3af}
.step.is-expandable{cursor:pointer;touch-action:manipulation}
.materials{margin:0;padding-left:20px}
.materials li{padding:2px 0}
/* 赋分标准速查：逐格明细来自 PPT 纯图片页，紧凑两列排版 */
.block--score .materials{padding-left:0;list-style:none;display:grid;gap:5px}
.block--score .materials li{padding:7px 10px;border-radius:9px;background:rgba(231,244,246,.75);
  font-size:13px;line-height:1.55;word-break:break-word}
.meta{margin:0}
.meta__row{display:flex;gap:8px;min-width:0;padding:4px 0;font-size:12.5px}
.meta__key{flex:0 0 60px;color:var(--sub)}
.meta__val{flex:1;min-width:0;margin:0;color:#4b656c;word-break:break-all}

/* 结果页操作栏 */
.actions{display:flex;gap:10px;margin-top:14px;min-width:0}
.act{position:relative;flex:1;min-width:0;height:46px;display:flex;align-items:center;justify-content:center;gap:8px;
  border:1px solid var(--line);border-radius:14px;background:#fff;color:#33555e;font-size:14px;font-weight:700;
  cursor:pointer;touch-action:manipulation;box-shadow:var(--shadow-sm)}
.act.is-checked{background:#f3fbf9;border-color:#a9ddd7;color:#0b6a72}
.act__tick{position:relative;flex:0 0 16px;width:16px;height:16px;border:1.5px solid #9ca3af;border-radius:50%}
.act__tick::after{content:"";position:absolute;left:4px;top:1px;width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0}
.act.is-checked .act__tick{background:var(--brand);border-color:var(--brand)}
.act__star{position:relative;flex:0 0 16px;width:16px;height:16px}
.act__star::before,.act__star::after{content:"★";position:absolute;inset:0;font-size:16px;line-height:16px}
.act__star::before{color:#d1d5db}
.act__star::after{color:#f59e0b}

/* 待办 / 收藏列表 */
.itemlist{list-style:none;margin:0;padding:0}
.item{margin-bottom:10px}
.item__link{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0;width:100%;
  min-height:52px;padding:14px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-sm);text-align:left;font:inherit;color:inherit;cursor:pointer}
.item__text{flex:1;min-width:0;font-size:14px}
.item__arrow{flex:0 0 auto;color:#9ca3af}

/* 规则说明：顶部死固定返回栏 + 正文容器留白、深灰、行高 1.6、段落间距 16px、小标题加粗 */
.about-bar{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:10px;
  padding:10px 4px;margin:0 -4px 6px;background:linear-gradient(180deg,#fff 80%,rgba(255,255,255,.85));
  border-bottom:1px solid var(--line);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.about-back{display:inline-flex;align-items:center;gap:4px;min-height:40px;padding:6px 12px 6px 10px;
  border:1px solid var(--line);border-radius:999px;background:#fff;color:#33555e;font-size:14px;font-weight:600;
  cursor:pointer;touch-action:manipulation}
.about-back::before{content:"←";font-size:17px;line-height:1;margin-right:2px}
.about-bar__title{font-size:16px;font-weight:750;color:#123840}
.about-body{padding:20px;color:#333;line-height:1.6;font-size:14px}
.about-body p{margin:0 0 16px;word-break:break-word}
.about-body h3{margin:22px 0 8px;font-size:15px;font-weight:700;color:#123840;line-height:1.4}
.about-body .about-src{font-size:13px;color:#4b656c;word-break:break-all;margin-bottom:8px}
.about-body .about-disclaimer{margin:18px 0 0;padding:12px 14px;border-radius:12px;background:#fffbeb;color:#92400e;font-size:13px;line-height:1.6}

/* 底部导航 */
.tabbar{position:fixed;left:50%;bottom:0;width:100%;max-width:420px;transform:translateX(-50%);display:flex;z-index:5;
  padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:rgba(255,255,255,.96);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-top:1px solid var(--line)}
.tabbar button{position:relative;flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:4px;
  height:44px;border-radius:12px;font-size:14px;color:var(--sub);overflow:hidden;background:transparent;border:0;cursor:pointer;font-family:inherit;padding:0}
.tabbar button::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,#d7f2ee,#dfeaff);opacity:0}
.tabbar button > *{position:relative}
.tabbar button.is-active::before{opacity:1}
.tabbar button.is-active{color:#0b6a72;font-weight:700}
.badge{font-size:11px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--grad);
  color:#fff;display:inline-flex;align-items:center;justify-content:center}

/* ===== 动效：补间属性只有 transform / opacity，时长 150–250ms ===== */
[data-press]{transition:transform var(--motion-dur-fast) var(--motion-ease)}
[data-press].is-pressed{transform:scale(.96)}
.chip,.tabbar a,.act{transition:transform 180ms var(--motion-ease)}
.chip::before,.tabbar a::before{transition:opacity 180ms var(--motion-ease)}
.chip.is-active{transform:scale(1.03)}
.chip.is-pressed,.tabbar button.is-pressed,.act.is-pressed{transform:scale(.96)}

/* 必须动效 1｜场景胶囊选中态：底色 opacity 0→1 + 本体 scale 1→1.03（同组互斥） */
/* 必须动效 2｜加入待办打勾 */
.act__tick::after{opacity:0;transform:scale(.6) rotate(45deg);
  transition:opacity var(--motion-dur) var(--motion-ease),transform var(--motion-dur) var(--motion-ease)}
.act.is-checked .act__tick::after{opacity:1;transform:scale(1) rotate(45deg)}
.act__star::before{opacity:1;transform:scale(1);transition:opacity 180ms var(--motion-ease),transform 180ms var(--motion-ease)}
.act__star::after{opacity:0;transform:scale(.6);transition:opacity 180ms var(--motion-ease),transform 180ms var(--motion-ease)}
.act.is-active .act__star::before{opacity:0}
.act.is-active .act__star::after{opacity:1;transform:scale(1)}

/* 必须动效 3｜步骤展开 / 收起：不做 height 补间，占位由 hidden 一次性切换 */
.step__arrow{transform:rotate(-45deg);transition:transform 180ms var(--motion-ease)}
.step.is-expanded .step__arrow{transform:rotate(45deg)}
.step__note{opacity:0;transform:translateY(-6px);
  transition:opacity var(--motion-dur-fast) var(--motion-ease),transform var(--motion-dur-fast) var(--motion-ease)}
.step.is-expanded .step__note{opacity:1;transform:translateY(0)}

/* 减少动态效果：只关过程，不关状态（终态仍完整可见） */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}
  .step__note{opacity:1!important;transform:none!important}
  [data-press].is-pressed{transform:none!important}
}
@media (max-width:374px){
  .app{padding-left:8px;padding-right:8px}
  .card{padding:16px 12px}
  .hero{padding:18px 14px}
  .hero__title{font-size:21px}
  .btn{padding:0 14px}
}
@media (min-width:600px){
  body{background:#eaf2f3}
  .app{padding-left:16px;padding-right:16px}
  .hero{margin-top:14px}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <button class="brand" type="button" data-nav="home" data-press>二课答疑<span>办事卡</span></button>
    <button class="topbar__link" type="button" data-nav="about" data-press>规则说明</button>
  </header>

  <div id="app-state" class="app-state" hidden></div>

  <main>
    <section id="view-home" class="view">
      <div class="hero">
        <h1 class="hero__title">输入你的问题，直接拿到一张能照着办的卡</h1>
        <p class="hero__sub">结论 · 下一步 · 去哪办 · 带什么 · 注意什么</p>
      </div>
      <form id="search-form" class="search" autocomplete="off">
        <input id="q" class="search__input" type="search" placeholder="输入问题或关键词" aria-label="输入问题">
        <button class="btn btn--primary" type="submit" data-press>查一下</button>
      </form>
      <div class="guide">
        <h2 class="guide__title">按主题找答案<span>点关键词直接查</span></h2>
        <div id="guide-tabs" class="guide__tabs" role="tablist" aria-label="主题分类"></div>
        <div id="guide-groups"></div>
      </div>
      <div class="quick">
        <h2 class="quick__title">大家常问</h2>
        <div id="quick-list" class="chips"></div>
      </div>
      <details class="browse" id="browse">
        <summary class="browse__summary">浏览全部主题<span id="browse-count"></span></summary>
        <div id="browse-groups" class="browse__groups"></div>
      </details>
      <div id="search-state" class="state" hidden></div>
    </section>

    <section id="view-result" class="view" hidden>
      <div class="view-head"><button class="back" type="button" data-nav="home" data-press>‹ 返回</button></div>
      <div id="result" class="state"></div>
      <div id="result-actions" class="actions" hidden>
        <button id="btn-todo" class="act" type="button" data-press aria-pressed="false">
          <span class="act__tick" aria-hidden="true"></span><span class="act__label">加入待办</span>
        </button>
        <button id="btn-fav" class="act" type="button" data-press aria-pressed="false">
          <span class="act__star" aria-hidden="true"></span><span class="act__label">收藏</span>
        </button>
      </div>
    </section>

    <section id="view-todo" class="view" hidden><h2 class="view__title">我的待办</h2><div id="todo-list"></div></section>
    <section id="view-fav" class="view" hidden><h2 class="view__title">我的收藏</h2><div id="fav-list"></div></section>
    <section id="view-about" class="view" hidden>
      <div class="about-bar">
        <button class="about-back" type="button" data-nav="home">返回</button>
        <span class="about-bar__title">规则说明</span>
      </div>
      <div id="about"></div>
    </section>
  </main>

  <nav class="tabbar" aria-label="主导航">
    <button type="button" data-nav="home" data-press><span>首页</span></button>
    <button type="button" data-nav="todo" data-press><span>待办</span><b id="todo-count" class="badge" hidden></b></button>
    <button type="button" data-nav="fav" data-press><span>收藏</span><b id="fav-count" class="badge" hidden></b></button>
    <button type="button" data-nav="about" data-press><span>规则</span></button>
  </nav>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

    var l = view.querySelectorAll('.chip');
    for (var i = 0; i < l.length; i++) {
      if (l[i].getAttribute('data-card-id') === id) { l[i].classList.add('is-active'); return; }
    }
  }

  // ===== 9. 空状态：一律给推荐场景（标签来自 cardsData 的 scene）=====
  function chip(card) {
    var b = el('button', 'chip');
    b.type = 'button';
    b.setAttribute('data-press', '');
    b.setAttribute('data-card-id', card.id);
    b.appendChild(el('span', null, card.scene));
    b.addEventListener('click', function () {
      state.lastSceneId = card.id;
      selectChip(card.id);
      if (jumpTimer) window.clearTimeout(jumpTimer);
      // 让 180ms 的选中淡入先真实播放完再切结果页；减少动效时直接切换
      if (REDUCED) { navigate('result', { id: card.id }); return; }
      jumpTimer = window.setTimeout(function () { jumpTimer = null; navigate('result', { id: card.id }); }, 190);
    });
    return b;
  }
  function stateBox(title, desc, cards) {
    var box = el('div', 'state__box');
    box.appendChild(el('p', 'state__title', title));
    box.appendChild(el('p', 'state__desc', desc));
    if (cards && cards.length) {
      var wrap = el('div', 'chips state__chips');
      cards.forEach(function (c) { wrap.appendChild(chip(c)); });
      box.appendChild(wrap);
    }
    return box;
  }
  function showNoHit(container, cards) {
    container.hidden = false; clear(container);
    var list = (cards || []).slice(0, 6);
    container.appendChild(stateBox(FALLBACK,
      '知识库共收录 ' + state.cards.length + ' 个主题，可以先点一个看看，或换个说法再搜。', list));
  }
  // 空状态优先推荐「当前分类」的场景，避免 92 张卡时推荐跑偏
  function guideCards() {
    var list = state.cards.filter(function (c) { return c.category === state.guideKey; });
    return list.length ? list.slice(0, 6) : state.cards.slice(0, QUICK_COUNT);
  }

  // ===== 10. 列表 / 规则说明 =====
  function renderList(type) {
    var ids = type === 'todo' ? state.todo : state.fav;
    var cards = [];
    ids.forEach(function (id) {
      var c = findCard(id);
      if (c && cards.indexOf(c) === -1) cards.push(c);
    });
    var box = type === 'todo' ? $('#todo-list') : $('#fav-list');
    clear(box);
    if (!cards.length) {
      box.appendChild(stateBox(type === 'todo' ? '待办还是空的' : '还没有收藏',
        '下面是知识库已收录的场景，点一个看看。', state.cards.slice(0, QUICK_COUNT)));
      return;
    }
    var ul = el('ul', 'itemlist');
    cards.forEach(function (c) {
      var li = el('li', 'item'), b = el('button', 'item__link');
      b.type = 'button';
      b.setAttribute('data-open-id', c.id);
      b.setAttribute('data-press', '');
      b.appendChild(el('span', 'item__text', c.scene));
      b.appendChild(el('span', 'item__arrow', '›'));
      li.appendChild(b); ul.appendChild(li);
    });
    box.appendChild(ul);
  }
  function renderAbout() {
    var box = $('#about'); clear(box);
    var body = el('div', 'about-body'), sources = [];
    state.cards.forEach(function (c) {
      if (has(c.source) && sources.indexOf(c.source) === -1) sources.push(c.source);
    });
    if (sources.length) {
      body.appendChild(el('h3', null, '知识来源'));
      sources.forEach(function (s) { body.appendChild(el('p', 'about-src', s)); });
    }
    var dates = state.cards.map(function (c) { return c.updatedAt; }).filter(has).sort();
    if (dates.length) {
      body.appendChild(el('h3', null, '更新时间'));
      body.appendChild(el('p', null, dates[dates.length - 1]));
    }
    body.appendChild(el('h3', null, '收录场景'));
    body.appendChild(el('p', null, String(state.cards.length) + ' 个已审核主题'));
    body.appendChild(el('p', null, ENGINE_NOTE));
    body.appendChild(el('p', 'about-disclaimer', DISCLAIMER));
    box.appendChild(body);
  }

  // ===== 11. 视图切换：纯 DOM 事件驱动，禁用 hash / <a> 跳转，兼容微信内置浏览器 =====
  // navigate 统一控制各区块的 display:none/block（通过 hidden 属性），并触发对应渲染
  function navigate(name, opts) {
    opts = opts || {};
    if (VIEWS.indexOf(name) === -1) name = 'home';
    // 防连击：同一视图（非结果页带 id）重复点击只回到顶部，不重复渲染
    if (name === state.view && !opts.id) { window.scrollTo(0, 0); return; }
    state.view = name;
    VIEWS.forEach(function (k) { $('#view-' + k).hidden = (k !== name); });
    $$('.tabbar [data-nav]').forEach(function (b) { setClass(b, 'is-active', b.getAttribute('data-nav') === name); });
    $('#search-state').hidden = true;
    if (name === 'result') {
      var c = findCard(opts.id || '');
      if (c) renderCard(c);
      else { $('#result-actions').hidden = true; showNoHit($('#result'), guideCards()); }
    } else if (name === 'todo' || name === 'fav') renderList(name);
    else if (name === 'about') renderAbout();
    if (name === 'home' && state.lastSceneId) selectChip(state.lastSceneId);
    else clearChips();
    window.scrollTo(0, 0);
  }
  // 搜索入口共用：表单提交与分类关键词按钮走同一条链路
  function runSearch(q) {
    var box = $('#search-state');
    if (!q) { showNoHit(box, guideCards()); return; }
    var r = match(q);
    if (r.hit) {
      box.hidden = true; clear(box);
      state.lastSceneId = r.hit.id;
      navigate('result', { id: r.hit.id });
    } else {
      showNoHit(box, r.ties.length ? r.ties : guideCards());
    }
  }
  function onSearch(e) { e.preventDefault(); runSearch($('#q').value.trim()); }
  function clearPressed() {
    $$('.is-pressed').forEach(function (n) { n.classList.remove('is-pressed'); });
  }
  function closestPress(node) {
    while (node && node.nodeType === 1) {
      if (node.hasAttribute && node.hasAttribute('data-press')) return node;
      node = node.parentNode;
    }
    return null;
  }
  // 向上查找带指定属性的最近祖先，兼容不支持 Element.closest 的旧版微信 WebView
  function closestAttr(node, attr) {
    while (node && node.nodeType === 1) {
      if (node.hasAttribute && node.hasAttribute(attr)) return node;
      node = node.parentNode;
    }
    return null;
  }
  function bindEvents() {
    $('#search-form').addEventListener('submit', onSearch);
    $('#btn-todo').addEventListener('click', function () {
      toggleId('todo', $('#btn-todo'), 'is-checked', '已加入待办', '加入待办');
    });
    $('#btn-fav').addEventListener('click', function () {
      toggleId('fav', $('#btn-fav'), 'is-active', '已收藏', '收藏');
    });
    // 全局导航委托：所有带 data-nav 的元素（顶栏、返回、底部导航）统一走 navigate，禁用 <a>/hash
    document.addEventListener('click', function (e) {
      var t = closestAttr(e.target, 'data-nav');
      if (!t) return;
      e.preventDefault();
      navigate(t.getAttribute('data-nav'));
    });
    // 浏览主题（事件委托）：分类胶囊与关键词按钮由父容器统一监听，比逐元素绑定在微信里更稳
    $('#guide-tabs').addEventListener('click', function (e) {
      var t = closestAttr(e.target, 'data-tab-key');
      if (!t) return;
      state.guideKey = t.getAttribute('data-tab-key');
      renderGuide();
    });
    $('#guide-groups').addEventListener('click', function (e) {
      var t = closestAttr(e.target, 'data-keyword');
      if (!t) return;
      var w = t.getAttribute('data-keyword');
      $('#q').value = w;          // 回填输入框，返回首页时仍看得到刚才查的词
      runSearch(w);
    });
    // 待办 / 收藏列表项点击打开结果（委托在列表容器上）
    ['#todo-list', '#fav-list'].forEach(function (sel) {
      $(sel).addEventListener('click', function (e) {
        var t = closestAttr(e.target, 'data-open-id');
        if (!t) return;
        navigate('result', { id: t.getAttribute('data-open-id') });
      });
    });
    ['pointerdown', 'touchstart', 'mousedown'].forEach(function (ev) {
      document.addEventListener(ev, function (e) {
        var t = closestPress(e.target);
        if (t) t.classList.add('is-pressed');
      }, { passive: true });
    });
    ['pointerup', 'pointercancel', 'touchend', 'touchcancel', 'mouseup', 'blur'].forEach(function (ev) {
      window.addEventListener(ev, clearPressed);
    });
  }

  // ===== 12. 分类关键词引导：分类名取自 categories.json 白名单，关键词取自各卡 keywords =====
  function keywordBtn(word) {
    var b = el('button', 'kw', word);
    b.type = 'button';
    b.setAttribute('data-press', '');
    b.setAttribute('data-keyword', word);   // 委托给 #guide-groups 统一处理
    return b;
  }
  function renderGuide() {
    var tabs = $('#guide-tabs'); clear(tabs);
    var groups = (Array.isArray(guideData) ? guideData : []).filter(function (g) {
      return g && has(g.name) && Array.isArray(g.hints) && g.hints.length;
    });
    if (!groups.length) { $('#guide-groups').hidden = true; return; }
    if (!state.guideKey || !groups.some(function (g) { return g.key === state.guideKey; }))
      state.guideKey = groups[0].key;
    groups.forEach(function (g) {
      var b = el('button', 'guide-tab'), on = g.key === state.guideKey;
      b.type = 'button';
      b.setAttribute('data-press', '');
      b.setAttribute('role', 'tab');
      b.setAttribute('aria-selected', on ? 'true' : 'false');
      setClass(b, 'is-active', on);
      b.appendChild(el('span', null, g.name));
      if (g.count) b.appendChild(el('small', null, String(g.count)));
      b.setAttribute('data-tab-key', g.key);   // 委托给 #guide-tabs 统一处理
      tabs.appendChild(b);
    });
    var box = $('#guide-groups'); clear(box);
    groups.forEach(function (g) {
      if (g.key !== state.guideKey) return;
      var sec = el('div', 'guide-group'), row = el('div', 'guide-group__row');
      g.hints.forEach(function (w) { if (has(w)) row.appendChild(keywordBtn(w)); });
      if (!row.childNodes.length) return;
      sec.appendChild(row);
      box.appendChild(sec);
    });
  }
  function renderBrowse() {
    var box = $('#browse-groups'); clear(box);
    var groups = (Array.isArray(guideData) ? guideData : []);
    var n = $('#browse-count');
    if (n) n.textContent = state.cards.length + ' 个主题 · ' + groups.length + ' 类';
    groups.forEach(function (g) {
      if (!g || !has(g.name)) return;
      var list = state.cards.filter(function (c) { return c.category === g.key; });
      if (!list.length) return;
      var sec = el('div', 'browse__group');
      sec.appendChild(el('p', 'browse__cat', g.name + '（' + list.length + '）'));
      var wrap = el('div', 'chips');
      list.forEach(function (c) { wrap.appendChild(chip(c)); });
      sec.appendChild(wrap);
      box.appendChild(sec);
    });
  }

  // ===== 13. 同步启动：数据已在页面内，零 fetch、零异步、零外部依赖 =====
  function renderQuick() {
    var box = $('#quick-list'); clear(box);
    state.cards.slice(0, QUICK_COUNT).forEach(function (c) { box.appendChild(chip(c)); });
  }
  function boot() {
    state.cards = (Array.isArray(cardsData) ? cardsData : []).filter(function (c) {
      return c && c.status === 'reviewed' && has(c.scene);
    });
    state.todo = loadIds(KEY_TODO);
    state.fav = loadIds(KEY_FAV);
    if (!state.cards.length) {
      var n = $('#app-state');
      n.hidden = false; clear(n);
      n.appendChild(el('div', 'notice', '知识库为空，无法展示内容'));
      return;
    }
    $('#app-state').hidden = true;
    renderGuide();
    renderBrowse();
    renderQuick();
    updateBadges();
    bindEvents();
    navigate('home');
  }
  boot();
})();
</script>
</body>
</html>
